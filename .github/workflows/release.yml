name: Build installers

# Bump "version" in package.json and push to main → Windows + macOS installers are built
# and published as GitHub Release v<version>. Pushes that don't change the version are skipped.
# "Run workflow" on the Actions tab forces a rebuild of the current version.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ] \
             && gh release view "v$VERSION" -R "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists — bump the version in package.json to publish a new one."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.label }}
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    env:
      MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
      MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows (x64)
            os: windows-latest
            platform: win32
            arch: x64
            native: true
            builder: --win --x64
            artifact: dist/*.exe
          - label: macOS (Apple Silicon)
            os: macos-latest
            platform: darwin
            arch: arm64
            native: true
            builder: --mac --arm64
            artifact: dist/*.dmg
          - label: macOS (Intel)
            os: macos-latest
            platform: darwin
            arch: x64
            native: false
            builder: --mac --x64
            artifact: dist/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (${{ matrix.platform }}/${{ matrix.arch }} FFmpeg)
        run: npm ci --no-audit --no-fund
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Self-test bundled FFmpeg (export pipeline)
        if: matrix.native
        run: npm run test:export

      - name: Check GPU encoder options against bundled FFmpeg
        if: matrix.native
        run: npm run test:encoders

      - name: Keep only this platform's ffprobe
        run: node scripts/prune-ffprobe.js ${{ matrix.platform }} ${{ matrix.arch }}

      # Optional: a self-signed certificate (repo secrets MAC_SIGN_P12 + MAC_SIGN_PASSWORD) gives the
      # Mac app a stable signature, so macOS keeps its permissions across updates. See README.
      - name: Import macOS signing certificate
        if: matrix.platform == 'darwin' && env.MAC_SIGN_P12 != ''
        run: |
          KC="$RUNNER_TEMP/ts-sign.keychain-db"
          echo "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/ts-sign.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/ts-sign.p12" -k "$KC" -P "$MAC_SIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          HASH=$(security find-identity -p codesigning "$KC" | awk '/\)/ {print $2; exit}')
          test -n "$HASH"
          echo "TS_SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
          echo "TS_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/ts-sign.p12"

      - name: Build installer
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - run: ls -la installers

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Touchline Studio v${{ needs.version.outputs.version }}
          make_latest: 'true'
          files: installers/*
          body: |
            ## Download

            | Your computer | Installer |
            |---|---|
            | **Windows 10 / 11** | `Touchline-Studio-Windows-Setup.exe` |
            | **Mac with Apple Silicon** (M1–M4, 2020 and later) | `Touchline-Studio-Mac-arm64.dmg` |
            | **Mac with Intel** | `Touchline-Studio-Mac-x64.dmg` |

            Not sure which Mac you have? Apple menu → **About This Mac**: "Chip: Apple M…" means Apple Silicon.

            Everything is bundled (app runtime + FFmpeg). Nothing else needs to be installed.

            ### First launch
            The installers aren't signed with a paid Microsoft/Apple certificate, so the OS asks once:
            - **Windows:** "Windows protected your PC" → **More info** → **Run anyway**.
            - **macOS:** open the .dmg and drag Touchline Studio into Applications. Open it; if macOS says it can't verify the developer, go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.
              Then allow Camera, Microphone and **Screen & System Audio Recording** when asked.
